name: AiPro manual execution and integration tests

on:
  workflow_dispatch:
    inputs:
      target:
        description: Validation target
        required: true
        default: all
        type: choice
        options:
          - doctor
          - compile
          - smoke
          - integration
          - test
          - all
      python-version:
        description: Python runtime
        required: true
        default: "3.12"
        type: choice
        options:
          - "3.11"
          - "3.12"
          - "3.13"

permissions:
  contents: read

concurrency:
  group: manual-aipro-${{ github.ref }}-${{ inputs.target }}-${{ inputs.python-version }}
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install test dependency
        run: python -m pip install --upgrade "pytest>=8,<10"

      - name: Run selected AiPro target
        shell: bash
        env:
          AIPRO_MODE: PAPER
          AIPRO_LIVE_CONFIRM: "NO"
          ENABLE_LIVE_TRADING: "0"
          AIPRO_MARKET_DATA_PROVIDER: DEMO
          AIPRO_TELEGRAM_BOT_TOKEN: ""
          AIPRO_TELEGRAM_ALLOWED_CHAT_IDS: ""
          AIPRO_DB_PATH: ${{ runner.temp }}/aipro-manual.db
          AIPRO_LOG_DIR: ${{ runner.temp }}/aipro-manual-logs
        run: |
          set -o pipefail
          python -m aipro "${{ inputs.target }}" 2>&1 | tee aipro-manual.log

      - name: Upload validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aipro-${{ inputs.target }}-python-${{ inputs.python-version }}
          path: aipro-manual.log
          if-no-files-found: error
          retention-days: 14
